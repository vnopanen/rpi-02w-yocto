header:
  version: 14

machine: raspberrypi0-2w-64
distro: poky
target: core-image-minimal

repos:
  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: "2.18"
    layers: {}
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    branch: wrynose
    layers:
      meta:
  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    branch: wrynose
    layers:
      meta-poky:
  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: wrynose
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-multimedia:
  meta-raspberrypi:
    url: https://git.yoctoproject.org/meta-raspberrypi
    branch: master
  meta-local:
    path: meta-local

local_conf_header:
  minimal-config: |
    DISTRO_FEATURES:remove = "x11 wayland opengl ptest bluetooth bluez5 pulseaudio alsa 3g nfc pcmcia api-documentation"
    DISTRO_FEATURES:append = " wifi"
    IMAGE_INSTALL:remove = "man-pages man-db info"
    IMAGE_INSTALL:append = " ${MACHINE_EXTRA_RRECOMMENDS} wpa-supplicant init-ifupdown"
    IMAGE_FEATURES:append = " ssh-server-dropbear empty-root-password"
    IMAGE_FSTYPES = "wic.zst wic.bmap"
    GPU_MEM = "16"
    DISABLE_VC4GRAPHICS = "1"
    ENABLE_HDMI = "0"
    ENABLE_AUDIO = "0"
    ENABLE_UART = "1"
    GLIBC_GENERATE_LOCALES = "en_US.UTF-8"
    IMAGE_LINGUAS = "en-us"
    INHERIT += "rm_work"
    PACKAGE_CLASSES = "package_ipk"
