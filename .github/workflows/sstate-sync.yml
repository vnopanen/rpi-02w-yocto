name: sync sstate cache

on:
  push:
    branches: [ main ]
    paths:
      - 'layers/meta-raspberrypi/**'
      - 'kas-project.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Build Kernel SState via kas-container
        run: ./kas-container build kas-project.yml --target linux-raspberrypi

      - name: Extract linux-raspberrypi artifacts
        run: |
          set -euo pipefail
          mkdir -p /tmp/pages-site
          cd build/sstate-cache
          find . -name "*linux-raspberrypi*" -print0 | tar --null -T - -cf - | tar -xf - -C /tmp/pages-site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
