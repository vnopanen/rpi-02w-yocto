name: build

on:
  push:
    branches: [ main ]
    paths:
      - 'kas-project.yml'
      - '.github/workflows/**'
      - 'meta-local/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Build via kas-container
        run: |
          set -o pipefail
          ./kas-container build kas-project.yml 2>&1 | tee build.log

      - name: Job summary report
        if: always()
        run: |
          SUMMARY_FILE="$GITHUB_STEP_SUMMARY"
          
          echo "## Build & cache report" >> "$SUMMARY_FILE"
          echo ""
          echo "### Sstate cache reuse" >> "$SUMMARY_FILE"
          echo '```text' >> "$SUMMARY_FILE"
          if [ -f "build.log" ]; then
              { grep -Ei "Sstate summary:|sstate reuse|build completion summary" build.log || echo "No summary found in build.log"; } >> "$SUMMARY_FILE"
          else
              echo "build.log not found." >> "$SUMMARY_FILE"
          fi
          echo '```' >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          BS_DIR=$(ls -td build/tmp/buildstats/*/ 2>/dev/null | head -n 1 || true)
          BS_SCRIPT="openembedded-core/scripts/buildstats-summary"
          BS_COUNT=50

          if [ -d "$BS_DIR" ] && [ -f "$BS_SCRIPT" ]; then
              echo "<details>" >> "$SUMMARY_FILE"
              echo "<summary><b>Top $BS_COUNT longest-running build tasks</b></summary>" >> "$SUMMARY_FILE"
              echo "" >> "$SUMMARY_FILE"
              echo '```text' >> "$SUMMARY_FILE"
              python3 "$BS_SCRIPT" --sort duration --highlight 0 "$BS_DIR" | tail -n "$BS_COUNT" | tac >> "$SUMMARY_FILE" || true
              echo '```' >> "$SUMMARY_FILE"
              echo "</details>" >> "$SUMMARY_FILE"
          else
              echo "Buildstats not available." >> "$SUMMARY_FILE"
          fi
          echo "" >> "$SUMMARY_FILE"

          echo "<details>" >> "$SUMMARY_FILE"
          echo "<summary><b>Top $BS_COUNT largest individual SState packages</b></summary>" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo '```text' >> "$SUMMARY_FILE"
          python3 scripts/sstate_size_report.py build/sstate-cache | tail -n "$BS_COUNT" | tac >> "$SUMMARY_FILE" || true
          echo '```' >> "$SUMMARY_FILE"
          echo "</details>" >> "$SUMMARY_FILE"

      - name: Upload SD Card Image Artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpi-02w-sd-image
          path: |
            build/tmp/deploy/images/raspberrypi0-2w-64/core-image-minimal-raspberrypi0-2w-64.rootfs.wic.zst
            build/tmp/deploy/images/raspberrypi0-2w-64/core-image-minimal-raspberrypi0-2w-64.rootfs.wic.bmap
          retention-days: 2

      - name: Validate sstate cache
        run: |
          set -euo pipefail
          CACHE_DIR=build/sstate-cache

          python3 openembedded-core/scripts/sstate-cache-management.py \
            --cache-dir "$CACHE_DIR" \
            --remove-orphans \
            --yes \
            --verbose

          python3 scripts/validate_sstate_cache.py "$CACHE_DIR"

          mapfile -d '' ARCHIVES < <(find "$CACHE_DIR" -type f -name '*.tar.zst' -print0)
          if ((${#ARCHIVES[@]})); then
              printf '%s\0' "${ARCHIVES[@]}" | xargs -0 -r zstd -q -t
          fi

          {
              echo "### Sstate cache validation"
              echo
              echo "Validated ${#ARCHIVES[@]} Zstandard archives and matching .siginfo files."
              echo "Archive integrity check: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sstate-cache
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/sstate-cache

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
