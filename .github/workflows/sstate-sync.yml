name: sync sstate cache

on:
  push:
    branches: [ main ]
    paths:
      - 'kas-project.yml'
      - '.github/workflows/**'
      - 'meta-local/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Build via kas-container
        run: ./kas-container build kas-project.yml

      - name: Copy sstate cache contents
        run: |
          set -euo pipefail
          mkdir -p /tmp/pages-site
          cd build/sstate-cache
          cp -a . /tmp/pages-site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
