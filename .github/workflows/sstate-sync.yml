name: build

on:
  push:
    branches: [ main ]
    paths:
      - 'kas-*'
      - '.github/workflows/sstate-sync.yml'
      - 'meta-local/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "sstate-sync-${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Configure R2 Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Download sstate-cache from R2
        run: |
          mkdir -p build/sstate-cache
          aws s3 sync s3://${{ secrets.R2_BUCKET }}/ ./build/sstate-cache/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} \
            --no-progress

      - name: Build via kas-container
        run: |
          set -o pipefail
          ./kas-container build kas-project.yml 2>&1 | tee build.log

      - name: Job summary report
        if: always()
        run: |
          SUMMARY_FILE="$GITHUB_STEP_SUMMARY"

          print_summary() {
              printf '%s\n' "$@" >> "$SUMMARY_FILE"
          }

          print_summary \
              "## Build & cache report" \
              "" \
              "### Sstate cache reuse" \
              '```text'
          if [ -f "build.log" ]; then
              if ! grep -Ei "Sstate summary:|sstate reuse|build completion summary" build.log >> "$SUMMARY_FILE"; then
                  print_summary "No summary found in build.log"
              fi
          else
              print_summary "build.log not found."
          fi
          print_summary '```' ""

          BS_DIR=$(ls -td build/tmp/buildstats/*/ 2>/dev/null | head -n 1 || true)
          BS_SCRIPT="openembedded-core/scripts/buildstats-summary"
          BS_COUNT=50

          if [ -d "$BS_DIR" ] && [ -f "$BS_SCRIPT" ]; then
              print_summary \
                  "<details>" \
                  "<summary><b>Top $BS_COUNT longest-running build tasks</b></summary>" \
                  "" \
                  '```text'
              python3 "$BS_SCRIPT" --sort duration --highlight 0 "$BS_DIR" |
                  tail -n "$BS_COUNT" |
                  tac >> "$SUMMARY_FILE" || true
              print_summary '```' '</details>' ""
          else
              print_summary "Buildstats not available." ""
          fi

          print_summary \
              "<details>" \
              "<summary><b>Top $BS_COUNT largest individual SState packages</b></summary>" \
              "" \
              '```text'
          python3 scripts/sstate_size_report.py build/sstate-cache |
              tail -n "$BS_COUNT" |
              tac >> "$SUMMARY_FILE" || true
          print_summary '```' '</details>' ""

      - name: Upload SD Card Image Artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpi-02w-sd-image
          path: |
            build/tmp/deploy/images/raspberrypi0-2w-64/core-image-minimal-raspberrypi0-2w-64.rootfs.wic.zst
            build/tmp/deploy/images/raspberrypi0-2w-64/core-image-minimal-raspberrypi0-2w-64.rootfs.wic.bmap
          retention-days: 2

      - name: Validate sstate cache
        run: |
          set -euo pipefail
          CACHE_DIR=build/sstate-cache

          python3 openembedded-core/scripts/sstate-cache-management.py \
            --cache-dir "$CACHE_DIR" \
            --remove-orphans \
            --remove-duplicated \
            --yes \
            --verbose

          python3 scripts/sstate_validate.py "$CACHE_DIR"

          mapfile -d '' ARCHIVES < <(find "$CACHE_DIR" -type f -name '*.tar.zst' -print0)
          if ((${#ARCHIVES[@]})); then
              printf '%s\0' "${ARCHIVES[@]}" | xargs -0 -r zstd -q -t
          fi

      - name: Upload sstate-cache to R2
        run: |
          aws s3 sync ./build/sstate-cache/ s3://${{ secrets.R2_BUCKET }}/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} \
            --delete \
            --no-progress
