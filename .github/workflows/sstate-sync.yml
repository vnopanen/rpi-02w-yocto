name: build

on:
  push:
    branches: [ main ]
    paths:
      - 'kas-project.yml'
      - '.github/workflows/**'
      - 'meta-local/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Build via kas-container
        run: |
          set -o pipefail
          ./kas-container build kas-project.yml 2>&1 | tee build.log

      - name: Job summary report
        if: always()
        run: |
          SUMMARY_FILE="$GITHUB_STEP_SUMMARY"
          
          echo "## Build & cache report" >> "$SUMMARY_FILE"
          echo ""
          echo "### Sstate cache reuse" >> "$SUMMARY_FILE"
          echo '```text' >> "$SUMMARY_FILE"
          if [ -f "build.log" ]; then
              { grep -E "Build completion summary:|sstate reuse" build.log || echo "No summary found in build.log"; } >> "$SUMMARY_FILE"
          else
              echo "build.log not found." >> "$SUMMARY_FILE"
          fi
          echo '```' >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          BS_DIR=$(ls -td build/tmp/buildstats/*/ 2>/dev/null | head -n 1 || true)
          BS_SCRIPT="openembedded-core/scripts/buildstats-summary"
          BS_COUNT=50

          if [ -d "$BS_DIR" ] && [ -f "$BS_SCRIPT" ]; then
              echo "<details>" >> "$SUMMARY_FILE"
              echo "<summary><b>Top $BS_COUNT longest-running build tasks</b></summary>" >> "$SUMMARY_FILE"
              echo ""
              echo '```text' >> "$SUMMARY_FILE"
          python3 "$BS_SCRIPT" --sort duration --highlight 0 "$BS_DIR" | tail -n "$BS_COUNT" >> "$SUMMARY_FILE"
              echo '```' >> "$SUMMARY_FILE"
              echo "</details>" >> "$SUMMARY_FILE"
          else
              echo "Buildstats not available." >> "$SUMMARY_FILE"
          fi
          echo "" >> "$SUMMARY_FILE"

          python3 scripts/sstate_size_report.py build/sstate-cache "$BS_COUNT" >> "$SUMMARY_FILE" || true

      - name: Upload SD Card Image Artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpi-02w-sd-image
          path: |
            build/tmp/deploy/images/raspberrypi0-2w-64/core-image-minimal-raspberrypi0-2w-64.rootfs.wic.zst
            build/tmp/deploy/images/raspberrypi0-2w-64/core-image-minimal-raspberrypi0-2w-64.rootfs.wic.bmap
          retention-days: 2

      - name: Copy sstate cache contents
        run: |
          set -euo pipefail
          mkdir -p /tmp/pages-site
          cd build/sstate-cache
          cp -a . /tmp/pages-site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
